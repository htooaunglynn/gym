server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip settings for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Handling React Router or SPA client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optionally proxy /api to the backend if we don't want to deal with CORS.
    # Currently, the Vite app uses direct URLs from .env, so proxying here isn't strictly necessary.
    # location /api/v1/ {
    #     proxy_pass http://backend:3000/api/v1/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
